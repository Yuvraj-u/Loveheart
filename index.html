<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoveHeart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0e0c1a;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* ----- main animated gradient ----- */
        .gradient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255, 180, 150, 0.50) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(200, 170, 255, 0.45) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(235, 210, 180, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 80%, rgba(160, 190, 230, 0.30) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 70%, rgba(220, 190, 250, 0.35) 0%, transparent 45%),
                #0e0c1a;
            background-blend-mode: normal, normal, normal, normal, normal, normal;
            background-size: 300% 300%, 300% 300%, 300% 300%, 300% 300%, 300% 300%, auto;
            animation: gradientShift 12s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%, 100% 0%, 50% 100%, 0% 100%, 100% 50%, 0 0;
            }
            20% {
                background-position: 30% 20%, 70% 80%, 20% 30%, 80% 20%, 30% 80%, 0 0;
            }
            40% {
                background-position: 70% 80%, 20% 30%, 80% 70%, 30% 80%, 70% 20%, 0 0;
            }
            60% {
                background-position: 100% 50%, 50% 100%, 0% 0%, 100% 50%, 50% 0%, 0 0;
            }
            80% {
                background-position: 50% 100%, 100% 50%, 0% 100%, 0% 0%, 100% 50%, 0 0;
            }
            100% {
                background-position: 0% 0%, 50% 50%, 100% 100%, 50% 100%, 0% 0%, 0 0;
            }
        }

        /* ----- floating orbs ----- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
            animation: orbFloat 16s ease-in-out infinite alternate;
            will-change: transform;
        }

        .orb--1 {
            width: 700px;
            height: 700px;
            background: rgba(255, 190, 165, 0.40);
            top: -10%;
            left: -10%;
            animation-duration: 14s;
            animation-delay: -2s;
        }

        .orb--2 {
            width: 600px;
            height: 600px;
            background: rgba(195, 175, 255, 0.35);
            bottom: -15%;
            right: -10%;
            animation-duration: 18s;
            animation-delay: -6s;
        }

        .orb--3 {
            width: 500px;
            height: 500px;
            background: rgba(230, 210, 185, 0.30);
            top: 40%;
            left: 55%;
            animation-duration: 16s;
            animation-delay: -10s;
        }

        .orb--4 {
            width: 450px;
            height: 450px;
            background: rgba(170, 195, 230, 0.30);
            top: 10%;
            right: 25%;
            animation-duration: 20s;
            animation-delay: -14s;
        }

        .orb--5 {
            width: 380px;
            height: 380px;
            background: rgba(215, 185, 245, 0.25);
            bottom: 20%;
            left: 20%;
            animation-duration: 22s;
            animation-delay: -4s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            20% {
                transform: translate(150px, -100px) scale(1.3) rotate(12deg);
            }
            40% {
                transform: translate(-120px, 150px) scale(0.8) rotate(-10deg);
            }
            60% {
                transform: translate(180px, 80px) scale(1.2) rotate(8deg);
            }
            80% {
                transform: translate(-140px, -80px) scale(0.85) rotate(-14deg);
            }
            100% {
                transform: translate(100px, -60px) scale(1.1) rotate(5deg);
            }
        }

        /* ----- shimmer ----- */
        .shimmer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(circle at 30% 40%, rgba(255, 240, 230, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 70% 60%, rgba(220, 210, 255, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            animation: shimmerPulse 4s ease-in-out infinite alternate;
        }

        @keyframes shimmerPulse {
            0% {
                opacity: 0.4;
            }
            100% {
                opacity: 1;
            }
        }

        /* ----- particles (fast & lively) ----- */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: particleDrift 22s infinite alternate ease-in-out;
            will-change: transform;
        }

        .particle--1 {
            width: 14px;
            height: 14px;
            background: rgba(255, 200, 180, 0.18);
            top: 15%;
            left: 10%;
            animation-duration: 16s;
            animation-delay: -3s;
            box-shadow: 0 0 30px rgba(255, 200, 180, 0.12);
        }
        .particle--2 {
            width: 20px;
            height: 20px;
            background: rgba(200, 185, 255, 0.15);
            bottom: 25%;
            right: 12%;
            animation-duration: 20s;
            animation-delay: -8s;
            box-shadow: 0 0 35px rgba(200, 185, 255, 0.10);
        }
        .particle--3 {
            width: 10px;
            height: 10px;
            background: rgba(235, 215, 190, 0.18);
            top: 55%;
            left: 80%;
            animation-duration: 14s;
            animation-delay: -12s;
            box-shadow: 0 0 20px rgba(235, 215, 190, 0.10);
        }
        .particle--4 {
            width: 25px;
            height: 25px;
            background: rgba(180, 205, 240, 0.12);
            top: 30%;
            left: 65%;
            animation-duration: 24s;
            animation-delay: -18s;
            box-shadow: 0 0 40px rgba(180, 205, 240, 0.08);
        }
        .particle--5 {
            width: 8px;
            height: 8px;
            background: rgba(225, 195, 250, 0.15);
            bottom: 40%;
            left: 30%;
            animation-duration: 18s;
            animation-delay: -5s;
            box-shadow: 0 0 15px rgba(225, 195, 250, 0.08);
        }
        .particle--6 {
            width: 16px;
            height: 16px;
            background: rgba(255, 215, 200, 0.12);
            top: 75%;
            right: 30%;
            animation-duration: 22s;
            animation-delay: -22s;
            box-shadow: 0 0 25px rgba(255, 215, 200, 0.08);
        }
        .particle--7 {
            width: 12px;
            height: 12px;
            background: rgba(190, 210, 250, 0.12);
            top: 45%;
            left: 20%;
            animation-duration: 19s;
            animation-delay: -9s;
            box-shadow: 0 0 20px rgba(190, 210, 250, 0.08);
        }
        .particle--8 {
            width: 18px;
            height: 18px;
            background: rgba(255, 220, 200, 0.10);
            bottom: 15%;
            left: 60%;
            animation-duration: 26s;
            animation-delay: -15s;
            box-shadow: 0 0 30px rgba(255, 220, 200, 0.06);
        }

        @keyframes particleDrift {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.2;
            }
            25% {
                transform: translate(200px, -160px) scale(2);
                opacity: 0.9;
            }
            50% {
                transform: translate(-160px, 200px) scale(0.5);
                opacity: 0.3;
            }
            75% {
                transform: translate(220px, 120px) scale(1.7);
                opacity: 1;
            }
            100% {
                transform: translate(-120px, -160px) scale(0.7);
                opacity: 0.2;
            }
        }

        /* ----- rotating rings ----- */
        .ring-container {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .ring {
            width: 550px;
            height: 550px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            box-shadow:
                0 0 120px rgba(255, 200, 180, 0.05),
                inset 0 0 120px rgba(200, 180, 255, 0.04);
            animation: ringSpin 25s linear infinite, ringPulse 5s ease-in-out infinite alternate;
            will-change: transform;
            position: relative;
        }

        .ring::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: ringSpin 40s linear infinite reverse;
        }

        .ring::after {
            content: '';
            position: absolute;
            inset: 50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: ringSpin 55s linear infinite;
        }

        .ring-inner {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: ringSpin 35s linear infinite reverse, ringPulse 7s ease-in-out infinite alternate;
            box-shadow: 0 0 80px rgba(255, 210, 190, 0.04);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ring-inner::after {
            content: '';
            position: absolute;
            inset: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            animation: ringSpin 45s linear infinite;
        }

        @keyframes ringSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes ringPulse {
            0% {
                transform: scale(0.85);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.15);
                opacity: 0.8;
            }
        }

        /* music toggle button */

        @media (max-width: 700px) {
            .orb--1 {
                width: 350px;
                height: 350px;
                filter: blur(60px);
            }
            .orb--2 {
                width: 300px;
                height: 300px;
                filter: blur(60px);
            }
            .orb--3 {
                width: 250px;
                height: 250px;
                filter: blur(50px);
            }
            .orb--4 {
                width: 220px;
                height: 220px;
                filter: blur(50px);
            }
            .orb--5 {
                width: 180px;
                height: 180px;
                filter: blur(40px);
            }
            .ring {
                width: 300px;
                height: 300px;
            }
            .ring-inner {
                width: 170px;
                height: 170px;
            }
            .ring::after {
                inset: 30px;
            }
            .ring-inner::after {
                inset: 25px;
            }
            .music-toggle {
                bottom: 20px;
                right: 20px;
                padding: 10px 20px;
                font-size: 0.75rem;
            }
        }

        /* no text, no pink — pure visual motion + ambient audio */
    </style>
</head>
<body>

    <!-- main gradient -->
    <div class="gradient-bg"></div>

    <!-- orbs -->
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="orb orb--4"></div>
    <div class="orb orb--5"></div>

    <!-- shimmer -->
    <div class="shimmer"></div>

    <!-- particles -->
    <div class="particle particle--1"></div>
    <div class="particle particle--2"></div>
    <div class="particle particle--3"></div>
    <div class="particle particle--4"></div>
    <div class="particle particle--5"></div>
    <div class="particle particle--6"></div>
    <div class="particle particle--7"></div>
    <div class="particle particle--8"></div>

    <!-- rotating rings -->
    <div class="ring-container">
        <div class="ring">
            <div class="ring-inner"></div>
        </div>
    </div>

    <!-- music toggle button -->
    <button class="music-toggle" id="musicToggle">♫ PLAY AMBIENT</button>
    <canvas id="canvas" style="position:absolute; top:0; left:0; z-index:10;"></canvas>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        ctx.fillStyle = "#A8607F";
        ctx.font = "bold 10px Arial", 6, "bold";
        ctx.textAlign = "center";

        let scale = 11;
        let i = 0;

        function draw() {
            let angle = i * (Math.PI * 2) / 120;

            let x = 16 * Math.pow(Math.sin(angle), 3) * scale;
            let y = (13 * Math.cos(angle)
                    - 5 * Math.cos(2 * angle)
                    - 2 * Math.cos(3 * angle)
                    - Math.cos(4 * angle)) * scale;

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;

            ctx.fillText("I love you", centerX + x, centerY - y);

            i++;

            // move through full circle
            if (i >= 120) {
                i = 0;
                scale++;
            }

            // stop after full heart is drawn
            if (scale <= 16) {
                requestAnimationFrame(draw);
            }
        }

        draw();
    </script>

</body>
</html>
